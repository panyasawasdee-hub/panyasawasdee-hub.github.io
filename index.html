<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KPS Link</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fc;color:#352750;font:16px system-ui,sans-serif}
    main{text-align:center;padding:24px}.mark{font-size:42px;color:#6b46b4}a{color:#5636a1}
  </style>
</head>
<body>
  <main><div class="mark">▦</div><p id="status">กำลังเปิดลิงก์...</p></main>
  <script>
    const API = 'https://script.google.com/macros/s/AKfycbxq6lXJWgs9CDTDJp9S-ehpehPFhRXHpRxrEo6TqMaep4W4tUImfB9UmmMzbTZU60KeGQ/exec';
    const MANAGER = 'https://panyasawasdee-hub.github.io/kps-short-link/';
    const params = new URLSearchParams(location.search);
    const bareQuery = /^\?[A-Za-z0-9_-]{1,40}$/.test(location.search) ? location.search.slice(1) : '';
    const pathCode = /^\/[A-Za-z0-9_-]{1,40}\/?$/.test(location.pathname) ? location.pathname.replaceAll('/', '') : '';
    const code = params.get('id') || bareQuery || pathCode;
    const status = document.querySelector('#status');

    if (!code || !/^[A-Za-z0-9_-]{1,40}$/.test(code)) {
      location.replace(MANAGER);
    } else {
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        status.innerHTML = 'เปิดลิงก์ไม่สำเร็จ<br><a href="' + MANAGER + '">กลับหน้าจัดการลิงก์</a>';
        script.remove();
      }, 15000);
      window.__kpsRedirect = result => {
        clearTimeout(timer);
        script.remove();
        delete window.__kpsRedirect;
        if (result && result.success && /^https?:\/\//i.test(result.targetUrl)) location.replace(result.targetUrl);
        else status.innerHTML = (result && result.error ? result.error : 'ไม่พบลิงก์นี้') + '<br><a href="' + MANAGER + '">กลับหน้าจัดการลิงก์</a>';
      };
      script.onerror = () => {
        clearTimeout(timer);
        status.innerHTML = 'เชื่อมต่อระบบลิงก์ไม่ได้<br><a href="' + MANAGER + '">กลับหน้าจัดการลิงก์</a>';
      };
      script.src = API + '?id=' + encodeURIComponent(code) + '&callback=__kpsRedirect';
      document.head.append(script);
    }
  </script>
</body>
</html>
